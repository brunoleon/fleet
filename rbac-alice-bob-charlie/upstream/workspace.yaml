---
###############################################################################
# TEAM ALPHA: Fleet Workspace & Tenant GlobalRole
###############################################################################
# 1. Fleet Workspace (creates the 'team-alpha' namespace in Rancher)
apiVersion: management.cattle.io/v3
kind: FleetWorkspace
metadata:
  name: team-alpha
---
# 2. Global Role for Team Alpha Tenant
apiVersion: management.cattle.io/v3
kind: GlobalRole
metadata:
  name: fleet-tenant-team-alpha
namespacedRules:
  team-alpha:
    - apiGroups: ["fleet.cattle.io"]
      resources: ["gitrepos", "helmops", "bundles"]
      verbs: ["*"]
    - apiGroups: ["fleet.cattle.io"]
      resources: ["policies"]
      verbs: ["get", "list", "watch"]
rules:
  - apiGroups: ["management.cattle.io"]
    resources: ["fleetworkspaces"]
    resourceNames: ["team-alpha"]
    verbs: ["*"]
---
# 3. Global Role Binding for Team Alpha Tenant
apiVersion: management.cattle.io/v3
kind: GlobalRoleBinding
metadata:
  name: alice-fleet-workspace-binding
globalRoleName: fleet-tenant-team-alpha
userName: u-alice
