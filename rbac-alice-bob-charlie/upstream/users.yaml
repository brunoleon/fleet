---
###############################################################################
# USER: Alice (Workspace: team-alpha)
###############################################################################
apiVersion: management.cattle.io/v3
# 1. User CR
kind: User
metadata:
  name: u-alice
enabled: true
username: alice
displayName: "Alice"
password: "$2a$10$nCgoWdqJwQs9prt7X5a/2eWLn88I8pon6iNat90u4rq4mHqtoPGQy"
principalIds:
  - "local://u-alice"
mustChangePassword: false

---
# 2. Global Role Binding (Standard User login)
apiVersion: management.cattle.io/v3
kind: GlobalRoleBinding
metadata:
  name: grb-alice-user
globalRoleName: user
userName: u-alice

---
# 3. Password Secret (read by Rancher's local auth provider)
apiVersion: v1
kind: Secret
metadata:
  name: u-alice
  namespace: cattle-local-user-passwords
type: Opaque
stringData:
  password: "$2a$10$nCgoWdqJwQs9prt7X5a/2eWLn88I8pon6iNat90u4rq4mHqtoPGQy"

---
# 4. Fleet Workspace RoleBinding (team-alpha)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alice-fleet-workspace-binding
  namespace: team-alpha
subjects:
  - kind: User
    name: u-alice
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: fleet-gitrepo-manager
  apiGroup: rbac.authorization.k8s.io

