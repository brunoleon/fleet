# 1. Target application namespace
apiVersion: v1
kind: Namespace
metadata:
  name: team-alpha-apps
---
# 2. The identity Fleet will impersonate on the downstream cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-alpha-deployer
  namespace: cattle-fleet-system
---
# 3. The permissions allowed inside the target application namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-alpha-deployer-role
  namespace: team-alpha-apps
rules:
  # Allow managing workload resources
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["*"]
  # Allow managing core network and storage objects
  - apiGroups: [""]
    resources:
      [
        "services",
        "configmaps",
        "secrets",
        "serviceaccounts",
        "persistentvolumeclaims",
      ]
    verbs: ["*"]
  # Add ingress or custom resources if needed by team-alpha
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["*"]
---
# 4. Bind the ServiceAccount in cattle-fleet-system to the Role in team-alpha-apps
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-alpha-deployer-binding
  namespace: team-alpha-apps
subjects:
  - kind: ServiceAccount
    name: team-alpha-deployer
    namespace: cattle-fleet-system
roleRef:
  kind: Role
  name: team-alpha-deployer-role
  apiGroup: rbac.authorization.k8s.io
